name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hotel-yab-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/hotel-yab-deploy
          chmod 600 ~/.ssh/hotel-yab-deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull and deploy on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/hotel-yab-deploy -p "$port" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/jaryan/Hotel-Yab && bash scripts/deploy-production.sh'
