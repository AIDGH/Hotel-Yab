name: Build crawl helper

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-crawl-helper.yml"
      - "scripts/build-crawl-helper.py"
      - "tools/instagram-travel-finder/collector.py"
      - "tools/instagram-travel-finder/desktop_worker.py"
      - "tools/instagram-travel-finder/detector.py"
      - "tools/instagram-travel-finder/download_approved.py"
      - "tools/instagram-travel-finder/helper-requirements.txt"
      - "tools/instagram-travel-finder/import_approved.py"
      - "tools/instagram-travel-finder/iran-locations.json"
      - "tools/instagram-travel-finder/local_crawl_worker.py"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: HotelYab-Crawler-macOS-arm64
          - os: macos-15-intel
            artifact: HotelYab-Crawler-macOS-x64
          - os: windows-latest
            artifact: HotelYab-Crawler-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/instagram-travel-finder/helper-requirements.txt
      - name: Install helper dependencies
        run: python -m pip install -r tools/instagram-travel-finder/helper-requirements.txt
      - name: Build standalone helper
        run: python scripts/build-crawl-helper.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/crawl-helper/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish helper download
        shell: bash
        env:
          CRAWL_HELPER_SSH_KEY: ${{ secrets.CRAWL_HELPER_SSH_KEY }}
        run: |
          test -n "$CRAWL_HELPER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$CRAWL_HELPER_SSH_KEY" > ~/.ssh/hotelyab-crawl-helper
          chmod 600 ~/.ssh/hotelyab-crawl-helper
          for attempt in {1..30}; do
            if scp \
              -i ~/.ssh/hotelyab-crawl-helper \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              output/crawl-helper/*.zip \
              jaryan@87.247.170.136:/home/jaryan/Hotel-Yab/apps/web/public/downloads/; then
              exit 0
            fi
            sleep 10
          done
          exit 1
